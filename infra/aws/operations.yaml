AWSTemplateFormatVersion: '2010-09-09'
Description: SGSI-UTV operations - CloudTrail, security alarms, AWS Backup vault and plan, budgets.
Parameters:
  AlertEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Address that receives alarm and budget notifications.
Resources:
  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'utv-cloudtrail-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules: [{Id: expire-90d, Status: Enabled, ExpirationInDays: 90}]
      Tags: [{Key: Name, Value: utv-cloudtrail-bucket}]
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals: {'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/utv-trail'}
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/utv-trail'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt TrailBucket.Arn, !Sub '${TrailBucket.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
  TrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /utv/cloudtrail
      RetentionInDays: 14
  TrailLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trail-to-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TrailLogGroup.Arn
      Tags: [{Key: Name, Value: utv-trail-log-role}]
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: utv-trail
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      S3BucketName: !Ref TrailBucket
      CloudWatchLogsLogGroupArn: !GetAtt TrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt TrailLogRole.Arn
      Tags: [{Key: Name, Value: utv-trail}]
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: utv-security-alerts
      Subscription:
        - {Protocol: email, Endpoint: !Ref AlertEmail}
      Tags: [{Key: Name, Value: utv-security-alerts}]
  RootUsageFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogGroup
      FilterPattern: '{ $.userIdentity.type = "Root" && $.userIdentity.invokedBy NOT EXISTS && $.eventType != "AwsServiceEvent" }'
      MetricTransformations:
        - {MetricNamespace: UTV/Security, MetricName: RootUsage, MetricValue: '1'}
  RootUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: utv-RootUsage
      Namespace: UTV/Security
      MetricName: RootUsage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  ConsoleNoMfaFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogGroup
      FilterPattern: '{ ($.eventName = "ConsoleLogin") && ($.additionalEventData.MFAUsed != "Yes") && ($.userIdentity.type = "IAMUser") && ($.responseElements.ConsoleLogin = "Success") }'
      MetricTransformations:
        - {MetricNamespace: UTV/Security, MetricName: ConsoleNoMfa, MetricValue: '1'}
  ConsoleNoMfaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: utv-ConsoleNoMfa
      Namespace: UTV/Security
      MetricName: ConsoleNoMfa
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  UnauthorizedApiFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogGroup
      FilterPattern: '{ ($.errorCode = "*UnauthorizedOperation") || ($.errorCode = "AccessDenied*") }'
      MetricTransformations:
        - {MetricNamespace: UTV/Security, MetricName: UnauthorizedApi, MetricValue: '1'}
  UnauthorizedApiAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: utv-UnauthorizedApi
      Namespace: UTV/Security
      MetricName: UnauthorizedApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  IamPolicyChangeFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogGroup
      FilterPattern: '{($.eventSource = iam.amazonaws.com) && (($.eventName=DeleteGroupPolicy)||($.eventName=DeleteRolePolicy)||($.eventName=DeleteUserPolicy)||($.eventName=PutGroupPolicy)||($.eventName=PutRolePolicy)||($.eventName=PutUserPolicy)||($.eventName=CreatePolicy)||($.eventName=DeletePolicy)||($.eventName=CreatePolicyVersion)||($.eventName=DeletePolicyVersion)||($.eventName=AttachRolePolicy)||($.eventName=DetachRolePolicy)||($.eventName=AttachUserPolicy)||($.eventName=DetachUserPolicy)||($.eventName=AttachGroupPolicy)||($.eventName=DetachGroupPolicy))}'
      MetricTransformations:
        - {MetricNamespace: UTV/Security, MetricName: IamPolicyChange, MetricValue: '1'}
  IamPolicyChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: utv-IamPolicyChange
      Namespace: UTV/Security
      MetricName: IamPolicyChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  SgChangeFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogGroup
      FilterPattern: '{ ($.eventName = AuthorizeSecurityGroupIngress) || ($.eventName = AuthorizeSecurityGroupEgress) || ($.eventName = RevokeSecurityGroupIngress) || ($.eventName = RevokeSecurityGroupEgress) || ($.eventName = CreateSecurityGroup) || ($.eventName = DeleteSecurityGroup) }'
      MetricTransformations:
        - {MetricNamespace: UTV/Security, MetricName: SgChange, MetricValue: '1'}
  SgChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: utv-SgChange
      Namespace: UTV/Security
      MetricName: SgChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  NaclChangeFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogGroup
      FilterPattern: '{ ($.eventName = CreateNetworkAcl) || ($.eventName = CreateNetworkAclEntry) || ($.eventName = DeleteNetworkAcl) || ($.eventName = DeleteNetworkAclEntry) || ($.eventName = ReplaceNetworkAclEntry) || ($.eventName = ReplaceNetworkAclAssociation) }'
      MetricTransformations:
        - {MetricNamespace: UTV/Security, MetricName: NaclChange, MetricValue: '1'}
  NaclChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: utv-NaclChange
      Namespace: UTV/Security
      MetricName: NaclChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  TrailChangeFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogGroup
      FilterPattern: '{ ($.eventName = CreateTrail) || ($.eventName = UpdateTrail) || ($.eventName = DeleteTrail) || ($.eventName = StartLogging) || ($.eventName = StopLogging) }'
      MetricTransformations:
        - {MetricNamespace: UTV/Security, MetricName: TrailChange, MetricValue: '1'}
  TrailChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: utv-TrailChange
      Namespace: UTV/Security
      MetricName: TrailChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: utv-backup-vault
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: utv-daily
        BackupPlanRule:
          - RuleName: daily
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 5 * * ? *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle: {DeleteAfterDays: 7}
  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: utv-tag-daily
        IamRoleArn: !ImportValue utv-identity-BackupRoleArn
        ListOfTags:
          - {ConditionType: STRINGEQUALS, ConditionKey: Backup, ConditionValue: daily}
  NetBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: utv-net-5usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 5, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
  GrossBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: utv-gross-30usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 30, Unit: USD}
        CostTypes: {IncludeCredit: false}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
Outputs:
  TrailName: {Value: !Ref Trail, Export: {Name: utv-operations-TrailName}}
  TrailBucketName: {Value: !Ref TrailBucket, Export: {Name: utv-operations-TrailBucketName}}
  BackupVaultName: {Value: !Ref BackupVault, Export: {Name: utv-operations-BackupVaultName}}
  AlarmTopicArn: {Value: !Ref AlarmTopic, Export: {Name: utv-operations-AlarmTopicArn}}
