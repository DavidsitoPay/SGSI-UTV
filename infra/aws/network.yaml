AWSTemplateFormatVersion: '2010-09-09'
Description: SGSI-UTV network - VPC, subnets, route tables, security groups, NACLs and flow logs.
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: utv-vpc}]
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: utv-igw}]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw
  WebSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: utv-web}]
  AppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: utv-app}]
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.4.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: utv-data-a}]
  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.6.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: utv-data-b}]
  AdminSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.5.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: utv-admin}]
  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: utv-public-rt}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref PublicRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: utv-private-rt}]
  WebRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref WebSubnet, RouteTableId: !Ref PublicRt}
  AppRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnet, RouteTableId: !Ref PrivateRt}
  DataARtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataSubnetA, RouteTableId: !Ref PrivateRt}
  DataBRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataSubnetB, RouteTableId: !Ref PrivateRt}
  AdminRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AdminSubnet, RouteTableId: !Ref PrivateRt}

  WebSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: utv web tier
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Name, Value: utv-web-sg}]
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: utv app tier
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # placeholder: inline egress removes the default allow-all
        - {IpProtocol: '-1', CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: utv-app-sg}]
  DataSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: utv data tier
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # placeholder: inline egress removes the default allow-all
        - {IpProtocol: '-1', CidrIp: 127.0.0.1/32}
      Tags: [{Key: Name, Value: utv-data-sg}]
  WebToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref WebSg, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, DestinationSecurityGroupId: !Ref AppSg}
  AppFromWebIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AppSg, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref WebSg}
  AppToDataEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSg, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DataSg}
  DataFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DataSg, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSg}

  WebNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Name, Value: utv-web-nacl}]}
  WebNaclIn100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref WebNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: {From: 443, To: 443}}
  WebNaclIn110:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref WebNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: {From: 1024, To: 65535}}
  WebNaclOut100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref WebNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: {From: 443, To: 443}}
  WebNaclOut110:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref WebNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: {From: 1024, To: 65535}}
  WebNaclOut120:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref WebNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.30.3.0/24, PortRange: {From: 8080, To: 8080}}
  WebNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref WebSubnet, NetworkAclId: !Ref WebNacl}

  AppNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Name, Value: utv-app-nacl}]}
  AppNaclIn100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.30.2.0/24, PortRange: {From: 8080, To: 8080}}
  AppNaclIn110:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.30.4.0/24, PortRange: {From: 1024, To: 65535}}
  AppNaclIn120:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.30.6.0/24, PortRange: {From: 1024, To: 65535}}
  AppNaclOut100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.30.4.0/24, PortRange: {From: 5432, To: 5432}}
  AppNaclOut110:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.30.6.0/24, PortRange: {From: 5432, To: 5432}}
  AppNaclOut120:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AppNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.30.2.0/24, PortRange: {From: 1024, To: 65535}}
  AppNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref AppSubnet, NetworkAclId: !Ref AppNacl}

  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Name, Value: utv-data-nacl}]}
  DataNaclIn100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.30.3.0/24, PortRange: {From: 5432, To: 5432}}
  DataNaclOut100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.30.3.0/24, PortRange: {From: 1024, To: 65535}}
  DataANaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DataSubnetA, NetworkAclId: !Ref DataNacl}
  DataBNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DataSubnetB, NetworkAclId: !Ref DataNacl}

  AdminNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Name, Value: utv-admin-nacl}]}
  AdminNaclIn100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AdminNacl, RuleNumber: 100, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: 10.30.0.0/16}
  AdminNaclOut100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: {NetworkAclId: !Ref AdminNacl, RuleNumber: 100, Protocol: -1, RuleAction: allow, Egress: true, CidrBlock: 10.30.0.0/16}
  AdminNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref AdminSubnet, NetworkAclId: !Ref AdminNacl}

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /utv/vpc/flowlogs
      RetentionInDays: 7
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
      Policies:
        - PolicyName: flowlogs-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn
      Tags: [{Key: Name, Value: utv-flowlog-role}]
  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 600
      Tags: [{Key: Name, Value: utv-flowlog}]
Outputs:
  VpcId: {Value: !Ref Vpc, Export: {Name: utv-network-VpcId}}
  WebSubnetId: {Value: !Ref WebSubnet, Export: {Name: utv-network-WebSubnetId}}
  AppSubnetId: {Value: !Ref AppSubnet, Export: {Name: utv-network-AppSubnetId}}
  DataSubnetAId: {Value: !Ref DataSubnetA, Export: {Name: utv-network-DataSubnetAId}}
  DataSubnetBId: {Value: !Ref DataSubnetB, Export: {Name: utv-network-DataSubnetBId}}
  AdminSubnetId: {Value: !Ref AdminSubnet, Export: {Name: utv-network-AdminSubnetId}}
  WebSgId: {Value: !GetAtt WebSg.GroupId, Export: {Name: utv-network-WebSgId}}
  AppSgId: {Value: !GetAtt AppSg.GroupId, Export: {Name: utv-network-AppSgId}}
  DataSgId: {Value: !GetAtt DataSg.GroupId, Export: {Name: utv-network-DataSgId}}
