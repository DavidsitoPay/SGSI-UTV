AWSTemplateFormatVersion: '2010-09-09'
Description: SGSI-UTV identity - MFA-gated admin and auditor roles, EC2 and Backup service roles.
Resources:
  DenyWithoutMfa:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: UtvDenyWithoutMfa
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            NotAction:
              - iam:CreateVirtualMFADevice
              - iam:EnableMFADevice
              - iam:GetUser
              - iam:ListMFADevices
              - iam:ListVirtualMFADevices
              - iam:ResyncMFADevice
              - iam:ChangePassword
              - iam:GetAccountPasswordPolicy
              - sts:GetSessionToken
            Resource: '*'
            Condition:
              BoolIfExists: {'aws:MultiFactorAuthPresent': 'false'}
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UtvAdminRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'}
            Action: sts:AssumeRole
            Condition:
              Bool: {'aws:MultiFactorAuthPresent': 'true'}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
        - !Ref DenyWithoutMfa
      Tags: [{Key: Name, Value: utv-admin-role}]
  AuditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UtvAuditorRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'}
            Action: sts:AssumeRole
            Condition:
              Bool: {'aws:MultiFactorAuthPresent': 'true'}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - !Ref DenyWithoutMfa
      Tags: [{Key: Name, Value: utv-auditor-role}]
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UtvEc2Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags: [{Key: Name, Value: utv-ec2-role}]
  Ec2Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: UtvEc2Profile
      Roles: [!Ref Ec2Role]
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: UtvBackupRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: backup.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
      Policies:
        - PolicyName: pass-ec2-role
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt Ec2Role.Arn
      Tags: [{Key: Name, Value: utv-backup-role}]
Outputs:
  Ec2InstanceProfileName: {Value: !Ref Ec2Profile, Export: {Name: utv-identity-Ec2InstanceProfileName}}
  BackupRoleArn: {Value: !GetAtt BackupRole.Arn, Export: {Name: utv-identity-BackupRoleArn}}
  AdminRoleArn: {Value: !GetAtt AdminRole.Arn, Export: {Name: utv-identity-AdminRoleArn}}
  AuditorRoleArn: {Value: !GetAtt AuditorRole.Arn, Export: {Name: utv-identity-AuditorRoleArn}}
